# פריסה אוטומטית של ה-Edge Functions מהקוד ב-git.
# 🧠 הפריסה קוראת את הקבצים ישירות מה-repo, כך ששום דבר לא מועתק ידנית, ומה שרץ
#    בשרת הוא בדיוק מה שב-commit. לפני הפריסה רצות הבדיקות, ופריסה לא יוצאת אם הן נכשלות.
# דרוש secret אחד ב-GitHub (Settings → Secrets and variables → Actions): SUPABASE_ACCESS_TOKEN
name: Deploy Edge Functions

on:
  push:
    branches: [main, claude/peaceful-sagan-gg0tmt]
    paths: ["supabase/functions/**", "supabase/config.toml", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT_REF: hwcgxyreboaqjoxrofgw

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck, lint, tests
        run: |
          deno task check
          deno task lint
          deno task test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::חסר secret בשם SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          for fn in ingest-healthkit telegram-webhook coach-scheduler; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done
